name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Install dependencies from lockfile
        run: uv sync --locked

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Run test suite
        run: uv run pytest tests/

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run mypy type check
        run: uv run mypy app/

  integration:
    runs-on: ubuntu-latest
    services:
      # PostgreSQL and Redis are provisioned here for Phase 3 integration tests
      # (workers, job queue). The current test suite still runs against
      # in-memory SQLite, so these services are not yet exercised by tests.
      # Keep them ready so Phase 3 integration tests can connect without
      # changing this workflow file.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Install dependencies from lockfile
        run: uv sync --locked

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+psycopg2://taskflow:taskflow@localhost:5432/taskflow
          REDIS_URL: redis://localhost:6379/0
        run: uv run pytest tests/
